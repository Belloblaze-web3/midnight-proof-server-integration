name: Midnight integration test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      proof-server:
        image: midnightntwrk/proof-server:8.1.3
        ports:
          - 6300:6300

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for proof server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6300/ready; then
              echo
              echo "Proof server is ready."
              exit 0
            fi
            echo "Waiting for proof server (attempt $i/30)..."
            sleep 5
          done

          echo "Proof server did not become ready."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test
